# ==============================================================================
# LogiXpress Tunisie - Infrastructure de développement
#
# Docker ne fournit QUE l'infrastructure (PostgreSQL + Redis).
# Les processus Node (API et Web) tournent directement sur la machine hôte :
#
#   docker compose up -d postgres redis
#   npm run dev:api
#   npm run dev:web
#
# La stack complète conteneurisée est dans docker-compose.prod.yml.
# Les identifiants par défaut correspondent à ceux de .env.example.
# ==============================================================================

services:
  # Base de données PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: logixpress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logixpress_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logixpress_secret_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-logixpress_db}
      TZ: ${TIMEZONE:-Africa/Tunis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts joués à la création du volume seulement : le rôle propriétaire
      # du journal d'audit. Voir docker/postgres/01-audit-owner.sql.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-logixpress_user} -d ${POSTGRES_DB:-logixpress_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - logixpress-network

  # Cache & file d'attente Redis 7 (optionnel pour l'API)
  redis:
    image: redis:7-alpine
    container_name: logixpress-redis
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Africa/Tunis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # Redis n'exige un mot de passe que si REDIS_PASSWORD est renseigné dans .env,
    # afin de rester aligné avec ce que lit la configuration côté API.
    command:
      - sh
      - -c
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
        exec redis-server --appendonly yes;
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG;
          else
          redis-cli ping | grep -q PONG;
          fi
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - logixpress-network

networks:
  logixpress-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
